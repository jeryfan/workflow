name: workflow

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app-environment: &app-environment
  TZ: UTC
  APP_ENV: production
  DEBUG: ${DEBUG:-false}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in docker/.env}
  FILE_SIGNING_KEY: ${FILE_SIGNING_KEY:?Set FILE_SIGNING_KEY in docker/.env}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
  DB_USERNAME: ${DB_USERNAME:-workflow}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-workflow}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  EXECUTION_BACKEND: celery
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: s3
  OPENDAL_S3_BUCKET: workflow
  OPENDAL_S3_REGION: us-east-1
  OPENDAL_S3_ENDPOINT: http://rustfs:9000
  OPENDAL_S3_ACCESS_KEY_ID: ${OPENDAL_S3_ACCESS_KEY_ID:?Set OPENDAL_S3_ACCESS_KEY_ID in docker/.env}
  OPENDAL_S3_SECRET_ACCESS_KEY: ${OPENDAL_S3_SECRET_ACCESS_KEY:?Set OPENDAL_S3_SECRET_ACCESS_KEY in docker/.env}
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:?Set SANDBOX_API_KEY in docker/.env}
  HTTP_REQUEST_PROXY: http://ssrf-proxy:3128

x-api-build: &api-build
  context: ..
  dockerfile: api/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-workflow}
      POSTGRES_USER: ${DB_USERNAME:-workflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-workflow} -d ${DB_DATABASE:-workflow}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${OPENDAL_S3_ACCESS_KEY_ID:?Set OPENDAL_S3_ACCESS_KEY_ID in docker/.env}
      RUSTFS_SECRET_KEY: ${OPENDAL_S3_SECRET_ACCESS_KEY:?Set OPENDAL_S3_SECRET_ACCESS_KEY in docker/.env}
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  api:
    build: *api-build
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      ssrf-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: *api-build
    environment:
      <<: *app-environment
      MODE: worker
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  beat:
    build: *api-build
    environment:
      <<: *app-environment
      MODE: beat
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    environment:
      API_KEY: ${SANDBOX_API_KEY:?Set SANDBOX_API_KEY in docker/.env}
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
      SANDBOX_PORT: 8194
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8194/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  ssrf-proxy:
    image: ubuntu/squid:latest
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
    volumes:
      - ./ssrf/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./ssrf/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
      - ./ssrf/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint: ["sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"]
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./www:/www:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/fastapi.conf:/etc/nginx/conf.d/fastapi.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/api.conf:/etc/nginx/api.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  web-legacy:
    profiles: ["compare"]
    build:
      context: ..
      dockerfile: web-legacy/Dockerfile
    environment:
      NODE_ENV: production
      DEPLOY_ENV: PRODUCTION
      CONSOLE_API_URL: http://legacy.localhost
      SERVER_CONSOLE_API_URL: http://api:8000
      APP_API_URL: http://legacy.localhost
      CONSOLE_WEB_URL: http://legacy.localhost
      NEXT_PUBLIC_ENABLE_AGENT_V2: "false"
      NEXT_PUBLIC_ENABLE_HITL_IM: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1) })"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  object-data:
