name: workflow

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-build: &api-build
  context: ..
  dockerfile: api/Dockerfile

x-app-environment: &app-environment
  TZ: UTC
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://workflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@postgres:5432/workflow
  REDIS_URL: redis://redis:6379/0
  EXECUTION_BACKEND: celery
  STORAGE_BACKEND: s3
  S3_BUCKET: workflow
  S3_REGION: us-east-1
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in docker/.env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in docker/.env}
  FILE_SIGNING_KEY: ${FILE_SIGNING_KEY:?Set FILE_SIGNING_KEY in docker/.env}
  PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost}
  PUBLIC_WEB_URL: ${PUBLIC_ORIGIN:-http://localhost}
  CONSOLE_API_URL: ${PUBLIC_ORIGIN:-http://localhost}
  CONSOLE_WEB_URL: ${PUBLIC_ORIGIN:-http://localhost}
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:?Set SANDBOX_API_KEY in docker/.env}
  HTTP_REQUEST_PROXY: http://ssrf_proxy:3128

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in docker/.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in docker/.env}
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  api:
    build: *api-build
    environment:
      <<: *app-environment
      MIGRATE_FROM_SQLITE: ${MIGRATE_FROM_SQLITE:-}
    volumes:
      - workflow-data:/legacy:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      ssrf_proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: *api-build
    command: sh -c "exec celery -A api.celery_app:celery_app worker --loglevel=INFO --concurrency=$${CELERY_CONCURRENCY:-2}"
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  beat:
    build: *api-build
    command: ["celery", "-A", "api.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    environment:
      API_KEY: ${SANDBOX_API_KEY:?Set SANDBOX_API_KEY in docker/.env}
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: 8194
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8194/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  ssrf_proxy:
    image: ubuntu/squid:latest
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
    volumes:
      - ./ssrf/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./ssrf/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
      - ./ssrf/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint: ["sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"]
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/api-locations.inc:/etc/nginx/conf.d/api-locations.inc:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  object-data:
  workflow-data:
