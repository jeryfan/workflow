[project]
name = "workflow-engine-api"
version = "0.1.0"
description = "Standalone Dify-compatible workflow editor API"
requires-python = "~=3.13.0"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "boto3>=1.40,<2",
    "celery>=5.5,<6",
    "charset-normalizer>=2.1,<5.0",
    "croniter>=3.0,<7.0",
    "email-validator>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jinja2>=3.1,<4.0",
    "json-repair>=0.55,<1.0",
    "jsonschema>=4.18,<5.0",
    "orjson>=3.10,<4.0",
    "packaging>=24,<26",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3.0",
    "pydantic-extra-types>=2,<3.0",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.22,<1.0",
    "pyyaml>=6.0,<7.0",
    "redis>=6,<8",
    "sqlalchemy>=2.0,<3.0",
    "typing-extensions>=4.15,<5.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.38,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.17,<1.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["api", "graphon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["src/graphon", "src/graphon"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
