location = /healthz {
    proxy_pass http://api:8000/healthz;
    include /etc/nginx/proxy.conf;
}

location /console/api/ {
    proxy_pass http://api:8000;
    include /etc/nginx/proxy.conf;
}

location /api/ {
    proxy_pass http://api:8000;
    include /etc/nginx/proxy.conf;
}

location /triggers/ {
    proxy_pass http://api:8000;
    include /etc/nginx/proxy.conf;
}
